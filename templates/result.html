<!DOCTYPE html>
<html>
<head>
    <title>Detection Results</title>

    <style>

        body{
            font-family:Segoe UI;
            background:#f4f6f9;
            padding:40px;
        }

        .container{
            width:90%;
            margin:auto;
        }

        h1{
            color:#1e3c72;
            text-align:center;
            margin-bottom:30px;
        }

        video{
            width:100%;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.2);
        }

        .buttons{
            margin-top:30px;
            text-align:center;
        }

        a{
            text-decoration:none;
            background:#1e3c72;
            color:white;
            padding:12px 25px;
            border-radius:8px;
            margin:10px;
            display:inline-block;
        }

        a:hover{
            background:#2a5298;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Detection Completed</h1>

        <video width="900" controls>
            <source
                src="{{ url_for('static', filename=output_video) }}"
                type="video/mp4">
        </video>

        <div class="buttons">

            <a href="/violations">
            View Violations
            </a>

            <a href="/">
            Upload Another Video
            </a>

        </div>

    </div>

</body>
</html>
