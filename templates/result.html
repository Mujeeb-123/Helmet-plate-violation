<!DOCTYPE html>
<html>
<head>

    <style>

        body{
            font-family:Segoe UI;
            background:#f4f6f9;
            margin:0;
            padding:40px;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:auto;
            text-align:center;
        }

        h1{
            color:#1e3c72;
            margin-bottom:10px;
        }

        p{
            color:#555;
            margin-bottom:30px;
        }

        video{
            width:100%;
            border-radius:12px;
            box-shadow:0 5px 20px rgba(0,0,0,.2);
        }

        .buttons{
            margin-top:30px;
        }

        a{
            text-decoration:none;
            background:#1e3c72;
            color:white;
            padding:12px 25px;
            border-radius:8px;
            margin:10px;
            display:inline-block;
            transition:.3s;
        }

        a:hover{
            background:#2a5298;
            transform:translateY(-2px);
        }

    </style>

</head>

<body>

    <div class="container">

    <h1>✅ Detection Completed Successfully</h1>

    <p>
    The uploaded video has been processed successfully.
    You can review the processed video below or view the detected violations.
    </p>

    <video controls>
        <source
            src="{{ url_for('static', filename=output_video) }}"
            type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="buttons">

    <a href="/violations">
        View Violations
    </a>

    <a href="/upload">
        Upload Another Video
    </a>

    <a href="/">
        Home
    </a>

    </div>

    </div>

</body>

</html>
